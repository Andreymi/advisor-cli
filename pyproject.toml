[project]
name = "mcp-advisor"
version = "0.1.0"
description = "MCP Server for getting second opinions from alternative LLM models"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-advisor = "mcp_advisor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_advisor"]
