[project]
name = "advisor-cli"
version = "0.1.0"
description = "CLI tool for getting second opinions from alternative LLM models"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0", "diskcache>=5.0.0"]
wizard = ["questionary>=2.0.0", "rich>=13.0.0"]
all = ["advisor-cli[mcp,wizard]"]

[project.scripts]
advisor = "advisor_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
